<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Special Event Operations — Pedder</title>
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/dark/main.css" />
  <style>
:root,
.calcite-mode-dark {
  --navy: #003B5C;
  --bg: #071824;
  --panel: #0C2231;
  --panel2: #123247;
  --gold: #F2A900;
  --text: #F4F7F9;
  --muted: #AFC3CF;
  --border: #28495B;
  --critical: #D9364F;
  --high: #F28C28;
  --medium: #F2C94C;
  --low: #36B37E;
  --focus: #8BD3FF;
  --app-brand: var(--gold);
  --app-surface: var(--panel);
  --app-border: var(--border);
  --app-text-muted: var(--muted);
  --calcite-color-brand: var(--gold);
  --calcite-color-brand-hover: #ffc038;
  --calcite-color-brand-press: #d99600;
  --calcite-color-foreground-1: var(--panel);
  --calcite-color-foreground-2: var(--panel2);
  --calcite-color-foreground-3: #183d53;
  --calcite-color-background: var(--bg);
  --calcite-color-text-1: var(--text);
  --calcite-color-text-2: var(--muted);
  --calcite-color-text-3: #8ca8b7;
  --calcite-color-border-1: var(--border);
  --calcite-color-border-2: #1c3c4e;
  --calcite-color-border-input: #456779;
  --calcite-color-focus: var(--focus);
  --calcite-color-status-danger: var(--critical);
  --calcite-color-status-warning: var(--medium);
  --calcite-color-status-success: var(--low);
}
* { box-sizing: border-box; }
html, body, calcite-shell { width: 100%; height: 100%; margin: 0; }
body { font-family: Arial, "Helvetica Neue", sans-serif; color: var(--text); background: var(--bg); overflow: hidden; }
calcite-navigation { --calcite-color-foreground-1: var(--navy); border-bottom: 2px solid var(--gold); background: linear-gradient(100deg, #002f49, var(--navy) 58%, #0c2231); }
calcite-navigation-logo { --calcite-color-text-1: var(--text); --calcite-color-text-2: var(--muted); }
calcite-shell-panel { border-color: var(--border); background: var(--panel); }
calcite-panel { --calcite-color-foreground-1: var(--panel); --calcite-color-border-3: var(--border); }
.workspace { display: grid; grid-template-rows: auto 1fr; min-width: 0; height: 100%; background: radial-gradient(circle at 48% -20%, #123247 0, var(--bg) 42%); }
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(8rem, 1fr)); gap: .55rem; padding: .65rem .75rem; }
.kpi-grid article { position: relative; min-width: 0; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--border); border-top: 2px solid var(--gold); border-radius: 2px; padding: .62rem .85rem; box-shadow: 0 8px 20px rgb(0 0 0 / 18%); }
.kpi-grid span { display: block; color: var(--muted); font-size: .68rem; font-weight: 700; letter-spacing: .095em; line-height: 1.3; text-transform: uppercase; }
.kpi-grid strong { display: block; margin-top: .18rem; color: var(--text); font-size: 1.45rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.map-card { min-height: 0; padding: 0 .75rem .75rem; }
#viewDiv { width: 100%; height: 100%; min-height: 24rem; border: 1px solid var(--border); box-shadow: inset 0 0 0 1px rgb(242 169 0 / 10%); }
.panel-content { display: grid; gap: .7rem; padding: .85rem; }
.date-grid { display: grid; grid-template-columns: 1fr; gap: .45rem; }
.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
.native-input { box-sizing: border-box; width: 100%; min-height: 2rem; border: 1px solid var(--calcite-color-border-input); border-radius: 1px; padding: .35rem .5rem; background: var(--panel2); color: var(--text); color-scheme: dark; }
.native-input:focus-visible, input:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#timeSlider { width: 100%; accent-color: var(--gold); }
#playbackLabel, .muted { color: var(--muted); font-size: .84rem; }
#assetSummary { border-bottom: 1px solid var(--border); }
calcite-list-item { --calcite-color-foreground-1: var(--panel); --calcite-color-foreground-2: var(--panel2); }
calcite-list-item time { color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
calcite-button:not([appearance="outline"]) { --calcite-color-brand: var(--gold); --calcite-color-text-inverse: #071824; font-weight: 700; }
calcite-button[appearance="outline"] { --calcite-color-brand: var(--gold); }
.esri-ui .esri-widget, .esri-ui .esri-widget--button { background: var(--panel); color: var(--text); }
.esri-ui .esri-widget--button:hover { background: var(--panel2); color: var(--gold); }
@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  calcite-shell-panel[slot="panel-end"] { display: none; }
}
@media (max-width: 560px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: .4rem; padding: .5rem; }
  .kpi-grid article { padding: .5rem .6rem; }
  .kpi-grid strong { font-size: 1.2rem; }
  .map-card { padding: 0 .5rem .5rem; }
}
  </style>
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
</head>
<body class="calcite-mode-dark">
  <calcite-shell>
    <calcite-navigation slot="header">
      <calcite-navigation-logo slot="logo" heading="Special Event Operations" description="Pedder asset movement audit"></calcite-navigation-logo>
      <calcite-action id="refreshAction" slot="content-end" icon="refresh" text="Refresh"></calcite-action>
    </calcite-navigation>

    <calcite-shell-panel slot="panel-start" position="start" width-scale="m">
      <calcite-panel heading="Playback controls">
        <div class="panel-content">
          <calcite-label>Event
            <calcite-select id="eventSelect" label="Event"><calcite-option value="">All events</calcite-option></calcite-select>
          </calcite-label>
          <div class="date-grid">
            <calcite-label>From<input id="fromTime" class="native-input" type="datetime-local" /></calcite-label>
            <calcite-label>To<input id="toTime" class="native-input" type="datetime-local" /></calcite-label>
          </div>
          <div class="button-row">
            <calcite-button id="applyButton" width="full" icon-start="filter">Apply</calcite-button>
            <calcite-button id="playButton" width="full" appearance="outline" icon-start="play">Play</calcite-button>
          </div>
          <calcite-label>Playback time
            <input id="timeSlider" type="range" min="0" max="100" value="100" />
          </calcite-label>
          <output id="playbackLabel" aria-live="polite">—</output>
          <calcite-button id="exportButton" width="full" appearance="outline" icon-start="download">Export filtered audit CSV</calcite-button>
          <calcite-notice id="notice" open kind="info" scale="s"><div slot="message">Loading configuration…</div></calcite-notice>
        </div>
      </calcite-panel>
    </calcite-shell-panel>

    <main class="workspace">
      <section class="kpi-grid" aria-label="Key performance indicators">
        <article><span>Active assets</span><strong id="kpiAssets">—</strong></article>
        <article><span>Moves</span><strong id="kpiMoves">—</strong></article>
        <article><span>Distance</span><strong id="kpiDistance">—</strong></article>
        <article><span>Deletes</span><strong id="kpiDeletes">—</strong></article>
      </section>
      <section class="map-card"><div id="viewDiv" aria-label="Operations map"></div></section>
    </main>

    <calcite-shell-panel slot="panel-end" position="end" width-scale="m">
      <calcite-panel heading="Asset detail timeline">
        <div id="assetSummary" class="panel-content muted">Select a current asset or movement trail.</div>
        <calcite-list id="timeline" label="Asset audit timeline"></calcite-list>
      </calcite-panel>
    </calcite-shell-panel>
  </calcite-shell>
  <script type="module">
const EMBEDDED_CONFIG = Object.freeze({
  "portalUrl": "https://publicsafety.maps.arcgis.com",
  "oauthAppId": "4p7jlBfp5hNmsZsZ",
  "source": {
    "itemId": "53d7f0d643a14d1a8de20ca6e687f21a",
    "layerId": 0,
    "title": "Current special-event assets"
  },
  "audit": {
    "itemId": "9fb69f32b67242e8a5ba093b0bfab9ae",
    "layerUrl": "https://services6.arcgis.com/SdBwj74JF24xKhpX/arcgis/rest/services/Special_Event_Asset_Audit_Log_20261030_144101/FeatureServer/0",
    "title": "Special Event Asset Audit Log"
  },
  "fields": {
    "auditObjectId": "OBJECTID",
    "auditGlobalId": "GlobalID",
    "sourceObjectId": "SourceObjectID",
    "sourceGlobalId": "SourceGlobalID",
    "eventId": "EventID",
    "unitId": "UnitID",
    "eventAssetId": "EventAssetID",
    "unitLocation": "UnitLocation",
    "unitType": "UnitType",
    "changeType": "ChangeType",
    "changeTime": "ChangeDateTime",
    "editorUser": "EditorUser",
    "processedTime": "ProcessedDateTime",
    "deliveryKey": "DeliveryKey",
    "sourceLayerUrl": "SourceLayerURL",
    "isLastKnown": "IsLastKnown"
  },
  "sourceFields": {
    "unitId": "unitid",
    "eventId": "eventid",
    "eventAssetId": "uniqueid",
    "unitLocation": "unitloc",
    "unitType": "unittype",
    "postStatus": "poststatus",
    "staffAgency": "staffagency"
  },
  "playback": {
    "defaultWindowHours": 24,
    "stepMinutes": 5,
    "intervalMs": 750,
    "trailColor": [
      242,
      169,
      0,
      0.9
    ],
    "positionColor": [
      139,
      211,
      255,
      0.95
    ]
  }
});

const ui = Object.fromEntries([
  "eventSelect", "fromTime", "toTime", "applyButton", "playButton", "timeSlider",
  "playbackLabel", "exportButton", "notice", "refreshAction", "timeline", "assetSummary",
  "kpiAssets", "kpiMoves", "kpiDistance", "kpiDeletes"
].map((id) => [id, document.getElementById(id)]));

const state = {
  config: null,
  view: null,
  layers: {},
  graphics: {},
  Graphic: null,
  auditRows: [],
  timer: null,
  requestToken: 0
};

const field = (name) => state.config.fields[name];
const escapeSql = (value) => String(value).replaceAll("'", "''");
const asDate = (value) => value == null ? null : new Date(value);
const fmtTime = (value) => value == null ? "—" : new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(asDate(value));
const fmtDistance = (metres) => metres >= 1000 ? `${(metres / 1000).toFixed(2)} km` : `${Math.round(metres || 0)} m`;
const rowTime = (feature) => asDate(feature.attributes[field("changeTime")])?.getTime() ?? 0;
const rowOid = (feature) => Number(feature.attributes[field("auditObjectId")] || 0);
const sourceKey = (feature) => String(feature.attributes[field("sourceObjectId")] ?? feature.attributes[field("sourceGlobalId")] ?? "");
const unitKey = (feature) => String(feature.attributes[field("unitId")] ?? sourceKey(feature));

function setNotice(message, kind = "info") {
  ui.notice.kind = kind;
  ui.notice.querySelector("[slot=message]").textContent = message;
  ui.notice.open = true;
}

function localInputValue(date) {
  const shifted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return shifted.toISOString().slice(0, 16);
}

function windowBounds() {
  const from = new Date(ui.fromTime.value);
  const to = new Date(ui.toTime.value);
  if (!Number.isFinite(from.getTime()) || !Number.isFinite(to.getTime()) || from >= to) {
    throw new Error("Choose a valid time range with From earlier than To.");
  }
  return { from, to };
}

function eventClause() {
  return ui.eventSelect.value ? `${field("eventId")} = '${escapeSql(ui.eventSelect.value)}'` : "1=1";
}

function timestampLiteral(date) {
  return date.toISOString().replace("T", " ").replace("Z", "");
}

async function queryAll(layer, query, pageSize = 1000) {
  const objectIds = await layer.queryObjectIds(query);
  if (!objectIds?.length) return [];
  const rows = [];
  for (let i = 0; i < objectIds.length; i += pageSize) {
    const q = layer.createQuery();
    q.objectIds = objectIds.slice(i, i + pageSize);
    q.outFields = query.outFields || ["*"];
    q.returnGeometry = query.returnGeometry ?? true;
    const result = await layer.queryFeatures(q);
    rows.push(...result.features);
  }
  return rows;
}

function sortedRows(rows) {
  return [...rows].sort((a, b) => rowTime(a) - rowTime(b) || rowOid(a) - rowOid(b));
}

function toLonLat(geometry) {
  if (!geometry || geometry.x == null || geometry.y == null) return null;
  const wkid = geometry.spatialReference?.latestWkid || geometry.spatialReference?.wkid;
  if (wkid === 4326 || wkid === 4269) return [geometry.x, geometry.y];
  if ([3857, 102100, 102113].includes(wkid)) {
    return [geometry.x * 180 / (Math.PI * 6378137), (2 * Math.atan(Math.exp(geometry.y / 6378137)) - Math.PI / 2) * 180 / Math.PI];
  }
  return null;
}

function distanceMetres(a, b) {
  const p = toLonLat(a), q = toLonLat(b);
  if (!p || !q) return null;
  const [lon1, lat1, lon2, lat2] = [p[0], p[1], q[0], q[1]].map((v) => v * Math.PI / 180);
  const dlon = lon2 - lon1, dlat = lat2 - lat1;
  const h = Math.sin(dlat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dlon / 2) ** 2;
  return 6371008.8 * 2 * Math.asin(Math.min(1, Math.sqrt(h)));
}

function latestStateAt(rows, cutoff) {
  const latest = new Map();
  for (const feature of rows) {
    if (rowTime(feature) > cutoff.getTime()) break;
    const key = sourceKey(feature);
    if (key) latest.set(key, feature);
  }
  return latest;
}

function popupTemplate(title) {
  return {
    title,
    content: [{ type: "fields", fieldInfos: [
      { fieldName: field("changeType"), label: "Change" },
      { fieldName: field("changeTime"), label: "Change time", format: { dateFormat: "short-date-short-time" } },
      { fieldName: field("eventId"), label: "Event ID" },
      { fieldName: field("unitId"), label: "Unit ID" },
      { fieldName: field("eventAssetId"), label: "Event asset ID" },
      { fieldName: field("unitLocation"), label: "Unit location" },
      { fieldName: field("unitType"), label: "Unit type" },
      { fieldName: field("sourceObjectId"), label: "Source ObjectID" },
      { fieldName: field("sourceGlobalId"), label: "Source GlobalID" },
      { fieldName: field("editorUser"), label: "Editor" },
      { fieldName: field("sourceLayerUrl"), label: "Source layer" }
    ] }]
  };
}

function drawAt(cutoff) {
  state.graphics.trails.removeAll();
  state.graphics.positions.removeAll();
  const cutoffMs = cutoff.getTime();
  const byUnit = new Map();
  for (const feature of state.auditRows) {
    if (rowTime(feature) > cutoffMs) break;
    const key = unitKey(feature);
    if (!key) continue;
    if (!byUnit.has(key)) byUnit.set(key, []);
    byUnit.get(key).push(feature);
  }

  const trailSymbol = { type: "simple-line", color: state.config.playback.trailColor, width: 2 };
  for (const [unitId, rows] of byUnit) {
    let path = [];
    const flush = () => {
      if (path.length < 2) { path = []; return; }
      const last = path[path.length - 1].feature;
      state.graphics.trails.add(new state.Graphic({
        geometry: { type: "polyline", paths: [path.map((p) => [p.x, p.y])], spatialReference: last.geometry.spatialReference },
        attributes: { ...last.attributes, __unitKey: unitId },
        symbol: trailSymbol,
        popupTemplate: popupTemplate(`Unit {${field("unitId")}} trail`)
      }));
      path = [];
    };
    for (const feature of rows) {
      const type = String(feature.attributes[field("changeType")] || "").toUpperCase();
      if (type === "DELETE") { flush(); continue; }
      if (!feature.geometry || rowTime(feature) < windowBounds().from.getTime()) continue;
      path.push({ x: feature.geometry.x, y: feature.geometry.y, feature });
    }
    flush();
  }

  const marker = { type: "simple-marker", color: state.config.playback.positionColor, size: 9, outline: { color: "#071824", width: 1 } };
  for (const feature of latestStateAt(state.auditRows, cutoff).values()) {
    if (String(feature.attributes[field("changeType")] || "").toUpperCase() === "DELETE" || !feature.geometry) continue;
    state.graphics.positions.add(new state.Graphic({
      geometry: feature.geometry,
      attributes: feature.attributes,
      symbol: marker,
      popupTemplate: popupTemplate(`Unit {${field("unitId")}}`)
    }));
  }
  updatePlaybackLabel(cutoff);
}

function movementMetrics(rows, from, to) {
  const priorBySource = new Map();
  let moves = 0, distance = 0, unavailable = 0;
  for (const feature of rows) {
    const key = sourceKey(feature);
    const type = String(feature.attributes[field("changeType")] || "").toUpperCase();
    const prior = priorBySource.get(key);
    const time = rowTime(feature);
    if (type !== "DELETE" && prior?.geometry && feature.geometry && time >= from.getTime() && time <= to.getTime()) {
      const metres = distanceMetres(prior.geometry, feature.geometry);
      if (metres == null) unavailable += 1;
      else if (metres > 0.01) { moves += 1; distance += metres; }
    }
    if (type === "DELETE") priorBySource.delete(key);
    else priorBySource.set(key, feature);
  }
  return { moves, distance, unavailable };
}

function updateKpis(from, to) {
  const inWindow = state.auditRows.filter((f) => rowTime(f) >= from.getTime() && rowTime(f) <= to.getTime());
  const deletes = inWindow.filter((f) => String(f.attributes[field("changeType")] || "").toUpperCase() === "DELETE").length;
  const latest = latestStateAt(state.auditRows, to);
  const active = [...latest.values()].filter((f) => String(f.attributes[field("changeType")] || "").toUpperCase() !== "DELETE").length;
  const movement = movementMetrics(state.auditRows, from, to);
  ui.kpiAssets.textContent = active.toLocaleString();
  ui.kpiMoves.textContent = movement.moves.toLocaleString();
  ui.kpiDistance.textContent = fmtDistance(movement.distance);
  ui.kpiDeletes.textContent = deletes.toLocaleString();
  return movement;
}

async function initialize() {
  state.config = EMBEDDED_CONFIG;
  const [ArcGISMap, MapView, FeatureLayer, GraphicsLayer, Graphic] = await Promise.all([
    $arcgis.import("@arcgis/core/Map.js"),
    $arcgis.import("@arcgis/core/views/MapView.js"),
    $arcgis.import("@arcgis/core/layers/FeatureLayer.js"),
    $arcgis.import("@arcgis/core/layers/GraphicsLayer.js"),
    $arcgis.import("@arcgis/core/Graphic.js")
  ]);

  // ProWork owns credential registration, refresh, and portal routing. Never
  // register tokens or start a second OAuth flow from this rendered page.
  const authReady = window.__esriAuthCtx?.authenticated
    ? await window.__esriAuthReady
    : { authenticated: false };
  if (!authReady.authenticated) {
    throw new Error("A signed-in ProWork portal session is required to load the private AAR layers.");
  }

  state.layers.source = new FeatureLayer({
    portalItem: { id: state.config.source.itemId, portal: { url: state.config.portalUrl } },
    layerId: state.config.source.layerId,
    title: state.config.source.title,
    outFields: ["*"]
  });
  state.layers.audit = new FeatureLayer({ url: state.config.audit.layerUrl, title: state.config.audit.title, outFields: ["*"], listMode: "hide" });
  state.graphics.trails = new GraphicsLayer({ title: "Audit trails (client-derived)" });
  state.graphics.positions = new GraphicsLayer({ title: "Audit playback positions" });
  const map = new ArcGISMap({ basemap: "dark-gray-vector", layers: [state.layers.source, state.graphics.trails, state.graphics.positions] });
  state.view = new MapView({ container: "viewDiv", map, center: [146.8, -41.2], zoom: 9, popupEnabled: true });
  state.Graphic = Graphic;

  window.__esriView = state.view;
  window.__esriMap = map;
  window.__esriLayers = {
    [state.layers.source.title]: state.layers.source,
    [state.layers.audit.title]: state.layers.audit,
    [state.graphics.trails.title]: state.graphics.trails,
    [state.graphics.positions.title]: state.graphics.positions
  };
  window.__app = {
    state,
    refresh,
    drawAt,
    setPlayback,
    stopPlayback,
    exportCsv,
    ready: false
  };

  await Promise.all([state.view.when(), state.layers.source.load(), state.layers.audit.load()]);

  const now = new Date();
  ui.toTime.value = localInputValue(now);
  ui.fromTime.value = localInputValue(new Date(now.getTime() - state.config.playback.defaultWindowHours * 3600000));
  bindEvents();
  await loadEvents();
  await refresh();
  if (state.layers.source.fullExtent) state.view.goTo(state.layers.source.fullExtent.expand(1.15)).catch(() => {});
  window.__app.ready = true;
}

async function loadEvents() {
  const q = state.layers.audit.createQuery();
  q.where = `${field("eventId")} IS NOT NULL`;
  q.outFields = [field("eventId")];
  q.returnGeometry = false;
  q.returnDistinctValues = true;
  q.orderByFields = [field("eventId")];
  const result = await state.layers.audit.queryFeatures(q);
  for (const id of [...new Set(result.features.map((f) => f.attributes[field("eventId")]).filter((v) => v != null).map(String))].sort()) {
    const option = document.createElement("calcite-option");
    option.value = id;
    option.textContent = id;
    ui.eventSelect.append(option);
  }
}

async function refresh() {
  const token = ++state.requestToken;
  stopPlayback();
  ui.applyButton.loading = true;
  setNotice("Loading ordered audit history…");
  try {
    const { from, to } = windowBounds();
    const q = state.layers.audit.createQuery();
    q.where = `${eventClause()} AND ${field("changeTime")} <= TIMESTAMP '${timestampLiteral(to)}'`;
    q.outFields = ["*"];
    q.returnGeometry = true;
    const rows = sortedRows(await queryAll(state.layers.audit, q));
    if (token !== state.requestToken) return;
    state.auditRows = rows;
    drawAt(to);
    const movement = updateKpis(from, to);
    ui.timeSlider.value = "100";
    const warning = movement.unavailable ? ` ${movement.unavailable} movement distances could not be calculated for the audit spatial reference.` : "";
    setNotice(`Loaded ${rows.length.toLocaleString()} audit records through the selected end time.${warning}`, movement.unavailable ? "warning" : "success");
  } catch (error) {
    console.error(error);
    setNotice(error.message || String(error), "danger");
  } finally {
    ui.applyButton.loading = false;
  }
}

function updatePlaybackLabel(date) {
  ui.playbackLabel.textContent = `Showing reconstructed state at ${fmtTime(date)}`;
}

function setPlayback(percent) {
  const { from, to } = windowBounds();
  const cutoff = new Date(from.getTime() + (to.getTime() - from.getTime()) * (percent / 100));
  drawAt(cutoff);
}

function togglePlayback() {
  if (state.timer) return stopPlayback();
  ui.playButton.textContent = "Pause";
  ui.playButton.iconStart = "pause";
  state.timer = window.setInterval(() => {
    const { from, to } = windowBounds();
    const increment = Math.max(1, 100 * state.config.playback.stepMinutes * 60000 / (to - from));
    const next = Number(ui.timeSlider.value) + increment;
    ui.timeSlider.value = String(Math.min(100, next));
    setPlayback(Math.min(100, next));
    if (next >= 100) stopPlayback();
  }, state.config.playback.intervalMs);
}

function stopPlayback() {
  if (state.timer) window.clearInterval(state.timer);
  state.timer = null;
  ui.playButton.textContent = "Play";
  ui.playButton.iconStart = "play";
}

function showTimeline(feature) {
  const key = sourceKey(feature);
  const unit = feature.attributes[field("unitId")] ?? key;
  ui.assetSummary.textContent = `Unit ${unit} • source ${key}`;
  ui.timeline.replaceChildren();
  const rows = state.auditRows.filter((row) => sourceKey(row) === key).sort((a, b) => rowTime(b) - rowTime(a) || rowOid(b) - rowOid(a));
  for (const row of rows.slice(0, 200)) {
    const item = document.createElement("calcite-list-item");
    item.label = row.attributes[field("changeType")] || "CHANGE";
    item.description = `${fmtTime(row.attributes[field("changeTime")])} • ${row.attributes[field("unitLocation")] || "No location label"}`;
    item.value = String(row.attributes[field("auditObjectId")] || "");
    ui.timeline.append(item);
  }
}

function csvCell(value) {
  if (value == null) return "";
  return `"${String(value).replaceAll('"', '""')}"`;
}

function exportCsv() {
  const { from, to } = windowBounds();
  const rows = state.auditRows.filter((f) => rowTime(f) >= from.getTime() && rowTime(f) <= to.getTime());
  if (!rows.length) return setNotice("There are no audit records in the selected window.", "warning");
  const names = Object.keys(rows[0].attributes);
  const lines = [names.map(csvCell).join(","), ...rows.map((feature) => names.map((name) => csvCell(feature.attributes[name])).join(","))];
  const blob = new Blob(["\uFEFF", lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `pedder-audit-${new Date().toISOString().replaceAll(":", "-")}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
}

function bindEvents() {
  ui.applyButton.addEventListener("click", refresh);
  ui.refreshAction.addEventListener("click", refresh);
  ui.playButton.addEventListener("click", togglePlayback);
  ui.exportButton.addEventListener("click", exportCsv);
  ui.timeSlider.addEventListener("input", () => setPlayback(Number(ui.timeSlider.value)));
  state.view.on("click", async (event) => {
    const hit = await state.view.hitTest(event, { include: [state.graphics.positions, state.graphics.trails] });
    const graphic = hit.results.find((result) => result.graphic)?.graphic;
    if (graphic) showTimeline(graphic);
  });
}

initialize().catch((error) => {
  console.error(error);
  setNotice(error.message || String(error), "danger");
});

  </script>
</body>
